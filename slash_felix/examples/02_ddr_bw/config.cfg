# 02_ddr_bw -- 2x 512-bit mem_bw kernels on the two WIRED DDR doors (DDR0, DDR1).
# FELIX has ONE DDR channel; the DDRMC exposes only 2 NoC doors (NUM_NSI=2), so
# DDR2/DDR3 are unmapped and using them segfaults the host. Two wide (512-bit) ports
# at 333 MHz already provide 42 GB/s of fabric into the ~21 GB/s channel -> saturates it.
# freqhz=333333333 matches vrt's CLOCK_MAX_FREQ cap (avoids the "exceeds max" warning).
[connectivity]
nk=mem_bw:2:mem_bw_0.mem_bw_1
sp=mem_bw_0.m_axi_gmem0:DDR0
sp=mem_bw_1.m_axi_gmem0:DDR1

[clock]
krnl=mem_bw_0
freqhz=333333333

[clock]
krnl=mem_bw_1
freqhz=333333333
