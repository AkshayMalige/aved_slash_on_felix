# 04_test_felix -- comprehensive platform test. Single 512-bit mem_bw kernel on DDR0
# (modeled on the reference `perf` kernel: extern "C" + explicit interface pragmas).
# One 512-bit port at 333 MHz = 21.3 GB/s, which saturates the single DDR4 channel,
# so a single instance is enough. Only DDR0/DDR1 are wired on FELIX (DDRMC NUM_NSI=2).
# freqhz=333333333 matches vrt's CLOCK_MAX_FREQ cap (avoids the "exceeds max" warning).
[connectivity]
nk=mem_bw:1:mem_bw_0
sp=mem_bw_0.m_axi_gmem0:DDR0

[clock]
krnl=mem_bw_0
freqhz=333333333
