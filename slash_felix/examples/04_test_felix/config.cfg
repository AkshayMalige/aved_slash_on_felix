# 04_test_felix -- comprehensive platform test. Two 512-bit mem_bw kernels, on the two
# wired DDR doors (modeled on the reference `perf` kernel: extern "C" + explicit
# interface pragmas). One HLS component.xml serves both instances.
#
# Why two instances: a SINGLE 512-bit m_axi READ port tops out at 8.39 GB/s -- reads
# need round-trip credit and one port cannot keep enough in flight. Two concurrent
# ports reach 13.74 GB/s (measured 2026-08-05). Writes are posted and already hit the
# ceiling with one port (13.48 GB/s either way), so the second port buys reads only.
#
# DDR0..DDR3 are NoC master ports out of the slash partition (linker/resources/
# bd_ports.txt: DDR0:M00_INI .. DDR3:M03_INI), NOT four memory channels -- FELIX has
# one DDR4 channel and they all converge on one DDRMC door. Only DDR0/DDR1 are wired;
# DDR2/DDR3 segfault the host.
#
# freqhz=250000000. NOT 333333333, even though the RM closes timing there.
#
# CRITICAL: the clk_wiz readback (getFrequency() / `v80-smi debug clockwiz --get`)
# ALWAYS echoes back whatever was requested, whether or not the MMCM actually locked
# to it. It is NOT evidence the clock changed. Only a measurement is.
#
# Measured 2026-08-05 with a clock-bound II=1 kernel (00_axilite increment/accumulate,
# 4 B/element, far below any DDR limit, so f = elements/second):
#   request 100 -> readback 100 -> MEASURED 100.0   engaged
#   request 150 -> readback 150 -> MEASURED 100.0   DID NOT ENGAGE
#   request 200 -> readback 200 -> MEASURED 150.0   DID NOT ENGAGE
#   request 250 -> readback 250 -> MEASURED 250.0   engaged
#   request 300 -> readback 300 -> MEASURED 250.0   DID NOT ENGAGE
#   request 333.33 -> readback 333.33 -> MEASURED 299.9  DID NOT ENGAGE
# A request that fails to engage silently leaves the fabric at the previous rate.
# 250 MHz is the highest value confirmed to engage, and it already saturates DDR
# (1-port write 13.46 GB/s, 2-port read 13.70), so nothing is lost by not using 333.
# Do NOT request 400 MHz either: the candidate search overshoots to 480 MHz.
#
# NOTE: before the 2026-08-05 vrt fix, freqhz was never applied at all for any value
# <= CLOCK_MAX_FREQ (the old code had no else branch), so the fabric silently kept
# whatever rate the board was last left at. See vrt/src/device.cpp and change_log.md.
[connectivity]
nk=mem_bw:2:mem_bw_0.mem_bw_1
sp=mem_bw_0.m_axi_gmem0:DDR0
sp=mem_bw_1.m_axi_gmem0:DDR1

[clock]
krnl=mem_bw_0
freqhz=250000000

[clock]
krnl=mem_bw_1
freqhz=250000000
